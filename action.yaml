name: Staging Deploy Docker Image for Lambdas
description: "Build docker image, tag, upload and set on lambdas"
inputs:
  lambda_names:
    description: Function names separated by space
    required: false
  prefix_function_names:
    description: Function prefix to match
    required: true
  aws_access_key_id:
    description: AWS Key ID
    required: true
  aws_secret_access_key:
    description: AWS Secret Access Key
    required: true
  ecr_image_name:
    description: Define the repository of ECR image
    required: true
  ecr_image_tag:
    description: Define the tag of ECR image
    required: true
  build_working_directory:
    description: Define the path of working directory of code to build Docker image
    required: true
  docker_build_extra_args:
    description: Define the extra arguments that you will set to docker build command
    required: false
    default: ""
  with_testing_db:
    description: Wether is necessary a testing db or not
    required: false
    default: "false"
  db_schemas:
    description: DB schemas list to create separated by a space
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up test db
      id: set-up-test-db
      if: ${{ inputs.with_testing_db == 'true' }}
      uses: meetlara/set-up-test-db@main
      with:
        db_schemas: ${{ inputs.db_schemas }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: 'false' # TODO: delete to change to 'true' by default (migration v1 to v2)

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build, tag, and push image to Amazon ECR and update function
      shell: bash
      working-directory: ${{ inputs.build_working_directory }}
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_NAME: ${{ inputs.ecr_image_name }}
        FUNCTION_NAMES: ${{ inputs.lambda_names }}
        PREFIX_FUNCTION_NAMES: ${{ inputs.prefix_function_names }}
        IMAGE_TAG: ${{ inputs.ecr_image_tag }}
      run: |
        cache_commit=$(aws ecr describe-images --repository-name $IMAGE_NAME --query "[imageDetails[?imageTags[0]=='$IMAGE_TAG'].imageTags[0]][] | [0]" --output=text)
        echo "Got latest docker image on repository. Tag: $cache_commit"
        
        if [ "$cache_commit" = "$IMAGE_TAG" ]; then
            echo "Already existed image; skipping."
        else
          tmp_dir=" /tmp/ecs-deploy-$(date +%s)"
          mkdir -p $tmp_dir;
          
          /usr/bin/docker buildx build --platform linux/amd64 --provenance=false --sbom=false --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new ${{ inputs.docker_build_extra_args }} --iidfile $tmp_dir/iidfile --tag $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG --metadata-file $tmp_dir/metadata-file --push .

          rm -rf $tmp_dir
          
          # This ugly bit is necessary if you don't want your cache to grow forever
          # until it hits GitHub's limit of 5GB.
          # Temp fix
          # https://github.com/docker/build-push-action/issues/252
          # https://github.com/moby/buildkit/issues/1896
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
        fi

        echo "image=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

        FUNCTION_LIST=$(aws lambda list-functions --query "Functions[?starts_with(FunctionName, '${PREFIX_FUNCTION_NAMES}')].FunctionName | @.join(' ', @)" --output text)
        if [ -n "${FUNCTION_NAMES}" ]; then
          FUNCTION_LIST="$FUNCTION_LIST $FUNCTION_NAMES"
        fi
        for functionName in $FUNCTION_LIST; do
          aws lambda update-function-code --function-name $functionName --image-uri $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
        done
